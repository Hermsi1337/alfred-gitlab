name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, semver without leading v (e.g. 3.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Validate version
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error::'$VERSION' is not valid semver (expected e.g. 3.1.0)"
            exit 1
          fi

      - name: Write version into info.plist
        run: |
          perl -0pi -e 's{(<key>version</key>\s*<string>)[^<]*(</string>)}{${1}'"$VERSION"'${2}}' src/info.plist
          grep -q "<string>$VERSION</string>" src/info.plist \
            || { echo "::error::Failed to write version into src/info.plist"; exit 1; }
          echo "info.plist version is now $VERSION"

      - name: Commit version bump to master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/info.plist; then
            echo "info.plist already at $VERSION - nothing to commit"
          else
            git add src/info.plist
            git commit -m "chore: release v$VERSION"
            git push origin HEAD:master
          fi

      - name: Build GitLab.alfredworkflow
        run: |
          cd src
          zip -r ../GitLab.alfredworkflow . -x '*.pyc' '*/__pycache__/*' '*.DS_Store'

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" GitLab.alfredworkflow \
            --target "$(git rev-parse HEAD)" \
            --title "v$VERSION" \
            --generate-notes
